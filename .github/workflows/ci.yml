name: CI

# Runs on every push to main and every pull request. Unlike the Python repo's
# workflow, this one is not path-scoped: Go builds the whole workspace in
# seconds, so filtering would add configuration without saving time.
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch when a new push arrives.
# Without this, a rapid series of pushes queues up redundant runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token needs nothing beyond reading the repo. Setting this
# explicitly means a compromised action cannot push, comment, or open a PR.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting, vet, and golangci-lint. Kept as its own job so a
  # formatting mistake surfaces without waiting for the test matrix.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          # setup-go keys its cache on every go.sum in the repo, which is the
          # right key for a workspace: adding a dependency anywhere
          # invalidates it. Until a module has dependencies there is no go.sum
          # and the step logs "Dependencies file is not found". That warning is
          # expected here and resolves itself once the backend modules land.
          cache: true

      # gofmt is not a style preference in Go, it is the format. There is one
      # correct output per file, so this is a hard failure rather than advice.
      # Every step below runs the same Makefile target you would run locally,
      # so a green `make check` on your machine means something. Spelling the
      # commands out twice is how CI and local drift apart.
      #
      # gofmt is not a style preference in Go, it is the format: one correct
      # output per file. So this is a hard failure rather than advice.
      - name: Check formatting
        run: make fmt-check

      # go vet ships with the toolchain and catches a specific set of real
      # bugs: printf verbs that do not match their arguments, unreachable code,
      # struct tags that will not parse, locks copied by value.
      - name: Vet
        run: make vet

      # golangci-lint is installed with `go install` rather than through
      # golangci/golangci-lint-action. Two reasons, both learned the hard way
      # on this workflow's first run:
      #
      #  1. The action's `version: latest` resolves to the v1 line, which
      #     cannot read a v2-format .golangci.yml and fails with
      #     "can't load config".
      #  2. Its prebuilt binary is compiled with an older Go than this module
      #     targets, which it refuses outright: "the Go language version
      #     (go1.24) used to build golangci-lint is lower than the targeted Go
      #     version". Building from source uses the toolchain set up above, so
      #     the two can never disagree.
      #
      # A third trap, unrelated to the action: `$(...)` inside an action's
      # `with: args:` is NOT expanded by a shell. It arrives literally.
      - name: Install golangci-lint
        run: make tools

      - name: Lint
        run: make lint

      # go.mod and go.sum must be what the code actually needs. Go 1.23's
      # -diff reports what tidy WOULD change and exits non-zero if anything,
      # with no copy-run-compare dance.
      #
      # Lesson 15 recommends this; the repo should follow its own advice.
      - name: Check go.mod is tidy
        run: make tidy-check

      # go.work is local only, and a consumer never sees it. A module that
      # imports another without the matching require builds fine here and
      # fails for everyone else. GOWORK=off is how you find out.
      - name: Check each module builds without the workspace
        run: make isolated-check

  # ---------------------------------------------------------------------------
  # Test — matrix across the two supported Go versions and both major OSes.
  #
  # fail-fast: false so a failure on one combination does not hide the others.
  # Windows is in the matrix because path handling and file permissions are
  # where cross-platform Go actually breaks, and this repo touches both.
  # ---------------------------------------------------------------------------
  test:
    name: Test / Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Windows on the older Go adds runner minutes without adding coverage:
        # anything it would catch, one of the other five combinations catches.
        exclude:
          - os: windows-latest
            go: "1.26"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build $(go list -m -f '{{.Dir}}/...')

      # -count=1 disables the test cache. In CI the cache is cold anyway, so
      # this costs nothing and removes any doubt about what actually ran.
      - name: Test
        run: go test -count=1 $(go list -m -f '{{.Dir}}/...')

      # Code behind a build tag is NOT compiled by default, so it is not type
      # checked, not vetted and not covered. Without this step,
      # go-concepts/14-embed-and-build-tags/debug_on.go could be broken for
      # months and every job would stay green.
      #
      # Every custom tag the repo uses belongs here.
      - name: Test with build tags
        run: go test -count=1 -tags debug $(go list -m -f '{{.Dir}}/...')

      # The Makefile examples need GNU make, which ubuntu-latest has (4.3) and
      # macos-latest ships as 3.81. The test detects the version and skips the
      # one feature 3.81 lacks, so both run and neither is a false pass.
      - name: make --version
        if: runner.os != 'Windows'
        run: make --version | head -1

  # ---------------------------------------------------------------------------
  # Database — the one module that needs a real Postgres.
  #
  # Its own job rather than a service on the test matrix, because service
  # containers only run on Linux runners and the matrix includes macOS and
  # Windows. Adding `services:` there fails the workflow rather than skipping.
  #
  # Every test in backends/learning/database-concepts SKIPS when no database is
  # reachable, which is what keeps the matrix green without one. This job is
  # what stops "skips everywhere" from counting as passing.
  # ---------------------------------------------------------------------------
  database:
    name: Database (Postgres 17 + pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's image rather than the official postgres one, because the
        # vectors package needs CREATE EXTENSION vector and the official image
        # does not ship it.
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_go_db

        ports:
          - 5432:5432

        # A service container's config cannot be overridden with `command:`, so
        # max_connections stays at the default 100. That is why the test step
        # below passes -p 4: the harness gives each package its own database
        # with a pool of 10, and eleven packages at once would ask for 110.
        options: >-
          --health-cmd "pg_isready -U postgres -d learn_go_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # One run, not two. -v so the skip messages are visible, tee so the output
      # reaches the log whether the run passes or fails.
      #
      # The grep is the point of the step. Every test in this module skips when
      # no database is reachable, which is what keeps the test matrix green
      # without one, and it means a typo in DATABASE_URL would turn this job
      # green while running nothing. A skip is not a pass.
      - name: Test against Postgres
        working-directory: backends/learning/database-concepts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -p 4 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/db-tests.log"

      - name: Fail if anything skipped for want of a database
        run: |
          if grep -q "no database available" "$RUNNER_TEMP/db-tests.log"; then
            echo "::error::tests skipped for want of a database"
            grep -n "no database available" "$RUNNER_TEMP/db-tests.log" | head
            exit 1
          fi
          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/db-tests.log") tests passed, none skipped"

  # ---------------------------------------------------------------------------
  # Backend — the module that needs Postgres, Redis and a Kafka broker.
  #
  # Separate from the `database` job because it needs three services rather than
  # one, and separate from the test matrix because service containers only run
  # on Linux runners.
  #
  # Every test in backends/learning/backend-concepts that needs a service SKIPS
  # when it cannot reach one, which is what keeps the matrix green without them.
  # This job is what stops "skips everywhere" from counting as passing.
  # ---------------------------------------------------------------------------
  backend:
    name: Services (Postgres + Redis + Kafka + Mailpit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_go_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d learn_go_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # Mailpit fits as a service container where Redpanda does not, because it is
      # configured entirely through environment variables and needs no command.
      mailpit:
        image: axllent/mailpit:latest

        env:
          MP_DATABASE: ""
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"

        ports:
          - 1025:1025
          - 8025:8025

        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Redpanda as a `docker run` step rather than a service container, and the
      # reason is a real limitation: a service container takes an image and
      # `options` (docker run flags) and CANNOT override the command. Redpanda
      # needs `redpanda start` with its listener flags, so it does not fit.
      #
      # The alternative is apache/kafka in KRaft mode, which is configured
      # entirely through environment variables and does fit. It is also six
      # variables that have to agree with each other, and a broker that starts
      # and advertises the wrong address looks like a client bug.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start \
              --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
              --node-id 0 --check=false \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://localhost:9092,external://localhost:19092

          # Poll rather than sleep. A fixed sleep is either too short on a slow
          # runner or wasted time on a fast one, and the failure mode of too
          # short is a suite that skips every Kafka test and passes.
          for i in $(seq 1 60); do
            if docker exec redpanda rpk cluster info --brokers localhost:9092 >/dev/null 2>&1; then
              echo "Redpanda ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Redpanda did not become ready"
          docker logs redpanda
          exit 1

      - name: Test the jobs module
        working-directory: backends/learning/jobs-concepts
        env:
          REDIS_ADDR: localhost:6379
        run: |
          set -o pipefail
          go test -count=1 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/jobs-tests.log"

      - name: Fail if the jobs tests skipped
        run: |
          if grep -q "no Redis at" "$RUNNER_TEMP/jobs-tests.log"; then
            echo "::error::jobs tests skipped for want of a Redis"
            exit 1
          fi

      - name: Test the email module
        working-directory: backends/learning/email-concepts
        env:
          MAILPIT_SMTP_PORT: 1025
          MAILPIT_API_URL: http://localhost:8025
        run: |
          set -o pipefail
          go test -count=1 -timeout 5m -v ./... 2>&1 | tee "$RUNNER_TEMP/email-tests.log"

      - name: Fail if the email tests skipped
        run: |
          if grep -q "no Mailpit at" "$RUNNER_TEMP/email-tests.log"; then
            echo "::error::email tests skipped for want of a Mailpit"
            exit 1
          fi

      - name: Test against the real services
        working-directory: backends/learning/backend-concepts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
          REDIS_ADDR: localhost:6379
          KAFKA_BROKERS: localhost:19092
        run: |
          set -o pipefail
          go test -count=1 -p 4 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"

      # A skip is not a pass. Three services means three ways for a connection
      # string to be wrong, and each one turns a third of the module green while
      # running none of it.
      - name: Fail if anything skipped for want of a service
        run: |
          missing=0

          for pattern in "no database available" "no Redis available" "no Kafka broker"; do
            if grep -q "$pattern" "$RUNNER_TEMP/backend-tests.log"; then
              echo "::error::tests skipped: $pattern"
              grep -n "$pattern" "$RUNNER_TEMP/backend-tests.log" | head -3
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/backend-tests.log") tests passed, none skipped"

      - name: Stop Redpanda
        if: always()
        run: docker rm -f redpanda

  # ---------------------------------------------------------------------------
  # Generated — regenerate the protobuf stubs and fail if they differ.
  #
  # The stubs are COMMITTED, so `git clone && go build ./...` works with nothing
  # but a Go toolchain. The reasoning is in .gitignore; this job is the other half
  # of it, because a committed generated file can drift from its source and
  # nothing else would notice.
  #
  # Its own job because it needs protoc, which nothing else does.
  # ---------------------------------------------------------------------------
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Install protoc
        # apt rather than a release download: the generated code does not depend
        # on the protoc version, only on the plugins, so the distribution's build
        # is fine and it is one line.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install the protoc plugins
        # @latest matches what generate.sh tells a developer to install. A pinned
        # version would be more reproducible and would also mean CI silently
        # passes with a plugin nobody has locally, which is the drift this job
        # exists to catch.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Regenerate the gRPC stubs
        working-directory: backends/learning/grpc-concepts
        run: ./generate.sh

      # gqlgen needs no external tool: it is a Go program, so `go run` is the
      # whole install. That is a real advantage over protoc and worth noticing
      # when choosing a generator.
      - name: Regenerate the GraphQL schema
        working-directory: backends/learning/graphql-concepts
        run: go run github.com/99designs/gqlgen generate

      - name: Fail if anything changed
        run: |
          if ! git diff --quiet; then
            echo "::error::the generated code is out of date; run ./generate.sh and commit"
            git diff --stat
            git diff
            exit 1
          fi

          echo "generated code matches the .proto files"

  # ---------------------------------------------------------------------------
  # Images — build every Dockerfile and run the containers.
  #
  # Its own job because it is slow (a cold run pulls golang and distroless) and
  # because it needs nothing else: no database, no Redis, no broker. The runner
  # already has Docker.
  # ---------------------------------------------------------------------------
  images:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # BuildKit, for the cache-mount Dockerfile. It is the default since Docker
      # 23 and the runner has a newer one, so this is belt and braces and it
      # documents the requirement.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run every image
        working-directory: backends/learning/docker-concepts
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -v ./... 2>&1 | tee "$RUNNER_TEMP/image-tests.log"

      - name: Fail if the image tests skipped
        run: |
          if grep -q "Docker is not available" "$RUNNER_TEMP/image-tests.log"; then
            echo "::error::image tests skipped for want of a Docker daemon"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Race — the race detector on its own job, because it is 5-10x slower than a
  # normal run and does not need the full matrix to be useful. One platform,
  # current Go.
  #
  # This is the job that justifies the whole workflow. A data race is undefined
  # behaviour that usually does not reproduce locally, and `-race` is the only
  # thing that reliably finds one. See go-concepts/16-race-detector.
  # ---------------------------------------------------------------------------
  race:
    name: Race detector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Test with -race
        run: go test -race -count=1 $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Cross-compile — build for every target the repo claims to support.
  #
  # This job exists because of a real bug: lesson 14 had platform files for
  # `unix` and `windows`, which looks exhaustive and is not. js/wasm, wasip1
  # and plan9 are none of those, and the package failed to build for them with
  # "undefined: currentPlatform".
  #
  # Nothing else catches that. Not the compiler, not vet, not the linter, and
  # not a test matrix of Linux, macOS and Windows, which is exactly what the
  # jobs above are. Only building for the uncovered target does.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: wasip1
            goarch: wasm
          - goos: plan9
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Build only; these targets cannot all be RUN here, and a build failure
      # is what this job is looking for.
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Coverage — informational. It writes a profile and prints the total, without
  # a threshold that fails the build.
  #
  # A coverage gate mostly teaches people to write tests that execute lines
  # without asserting anything. The number is worth watching and not worth
  # enforcing.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out $(go list -m -f '{{.Dir}}/...')

      - name: Report total
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload the profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
