# golangci-lint configuration — the analogue of the Python repo's ruff.toml.
#
# Run:  golangci-lint run ./...
# Fix:  golangci-lint run --fix ./...
#
# The default linter set is deliberately small. These additions are the ones
# that catch bugs this repo teaches about, so the linter agrees with the prose.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # an unclosed http.Response.Body leaks a connection
    - copyloopvar   # redundant `x := x` copies, now that Go 1.22 scopes loop vars
    - errorlint     # == on errors instead of errors.Is, %v instead of %w
    - goconst       # repeated string literals that want to be a constant
    - misspell
    - nilerr        # `return nil` on a path where err is non-nil
    - revive        # exported symbols want doc comments
    - rowserrcheck  # a forgotten rows.Err() after a sql.Rows loop
    - sqlclosecheck # a forgotten rows.Close()
    - unconvert     # conversions that do nothing
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: package-comments
          disabled: true # every lesson is package main; one doc comment per folder is enough

    goconst:
      # Demo fixtures repeat sample names ("Ana", "alice@example.com") across a
      # handful of examples in one file. At the default threshold of 3 that is
      # pure noise, and hoisting a constant would make the examples harder to
      # read, not easier. Five is high enough that a genuine magic string still
      # gets caught.
      min-occurrences: 5
      min-len: 4
      ignore-tests: true

formatters:
  enable:
    - gofmt
    - goimports
