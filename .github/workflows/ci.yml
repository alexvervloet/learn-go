name: CI

# Runs on every push to main and every pull request. Unlike the Python repo's
# workflow, this one is not path-scoped: Go builds the whole workspace in
# seconds, so filtering would add configuration without saving time.
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch when a new push arrives.
# Without this, a rapid series of pushes queues up redundant runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token needs nothing beyond reading the repo. Setting this
# explicitly means a compromised action cannot push, comment, or open a PR.
permissions:
  contents: read

# Every job has timeout-minutes, about three times its slowest observed run.
# Without it a hung step (a service that never becomes healthy, a test waiting
# on a channel nothing closes) holds a runner for GitHub's default of six hours.
# backends/learning/github-actions checks this file with its own rules and
# fails if any job is missing one.
jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting, vet, and golangci-lint. Kept as its own job so a
  # formatting mistake surfaces without waiting for the test matrix.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          # cache-dependency-path is not optional in a workspace. Without it
          # setup-go looks for a go.sum at the repository root, finds none
          # (a workspace root has go.work.sum and no go.mod), logs "Restore
          # cache failed: Dependencies file is not found" and caches nothing.
          # Every job in this file did that on every run until the path was
          # added. The comment here used to call the warning temporary.
          #
          # Every module's go.sum plus go.work.sum is the right key: adding a
          # dependency anywhere invalidates it.
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum
          CACHEPATH_DONE: |
            **/go.sum
            go.work.sum

      # gofmt is not a style preference in Go, it is the format. There is one
      # correct output per file, so this is a hard failure rather than advice.
      #
      # Every step below runs the same Makefile target you would run locally,
      # so a green `make check` on your machine means something. Spelling the
      # commands out twice is how CI and local drift apart.
      - name: Check formatting
        run: make fmt-check

      # go vet ships with the toolchain and catches a specific set of real
      # bugs: printf verbs that do not match their arguments, unreachable code,
      # struct tags that will not parse, locks copied by value.
      - name: Vet
        run: make vet

      # golangci-lint is installed with `go install` rather than through
      # golangci/golangci-lint-action. Two reasons, both learned the hard way
      # on this workflow's first run:
      #
      #  1. The action's `version: latest` resolves to the v1 line, which
      #     cannot read a v2-format .golangci.yml and fails with
      #     "can't load config".
      #  2. Its prebuilt binary is compiled with an older Go than this module
      #     targets, which it refuses outright: "the Go language version
      #     (go1.24) used to build golangci-lint is lower than the targeted Go
      #     version". Building from source uses the toolchain set up above, so
      #     the two can never disagree.
      #
      # A third trap, unrelated to the action: `$(...)` inside an action's
      # `with: args:` is NOT expanded by a shell. It arrives literally.
      - name: Install golangci-lint
        run: make tools

      - name: Lint
        run: make lint

      # go.mod and go.sum must be what the code actually needs. Go 1.23's
      # -diff reports what tidy WOULD change and exits non-zero if anything,
      # with no copy-run-compare dance.
      #
      # Lesson 15 recommends this; the repo should follow its own advice.
      - name: Check go.mod is tidy
        run: make tidy-check

      # go.work is local only, and a consumer never sees it. A module that
      # imports another without the matching require builds fine here and
      # fails for everyone else. GOWORK=off is how you find out.
      - name: Check each module builds without the workspace
        run: make isolated-check

  # ---------------------------------------------------------------------------
  # Test — matrix across the three major OSes, on the one Go version the repo
  # supports.
  #
  # One version, not two. Every go.mod says go 1.27, and since Go 1.21 that
  # line is a minimum toolchain: an older go command downloads 1.27 and
  # re-executes itself (GOTOOLCHAIN=auto, setup-go@v5's default). This matrix
  # used to have a "Go 1.26" leg, and its log said "go: downloading go1.27.1"
  # on every run. It tested 1.27 twice under two names. Testing an older Go for
  # real would mean lowering every go line and setting GOTOOLCHAIN=local, and
  # the lessons use 1.27 features, so the repo supports 1.27 and says so.
  #
  # The version stays a matrix axis so the job names keep their shape.
  #
  # fail-fast: false so a failure on one combination does not hide the others.
  # Windows is in the matrix because path handling and file permissions are
  # where cross-platform Go actually breaks, and this repo touches both.
  # ---------------------------------------------------------------------------
  test:
    name: Test / Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Build
        run: go build $(go list -m -f '{{.Dir}}/...')

      # -count=1 disables the test cache. In CI the cache is cold anyway, so
      # this costs nothing and removes any doubt about what actually ran.
      - name: Test
        run: go test -count=1 $(go list -m -f '{{.Dir}}/...')

      # Code behind a build tag is NOT compiled by default, so it is not type
      # checked, not vetted and not covered. Without this step,
      # go-concepts/14-embed-and-build-tags/debug_on.go could be broken for
      # months and every job would stay green.
      #
      # Every custom tag the repo uses belongs here.
      - name: Test with build tags
        run: go test -count=1 -tags debug $(go list -m -f '{{.Dir}}/...')

      # The Makefile examples need GNU make, which ubuntu-latest has (4.3) and
      # macos-latest ships as 3.81. The test detects the version and skips the
      # one feature 3.81 lacks, so both run and neither is a false pass.
      - name: make --version
        if: runner.os != 'Windows'
        run: make --version | head -1

  # ---------------------------------------------------------------------------
  # Database — the one module that needs a real Postgres.
  #
  # Its own job rather than a service on the test matrix, because service
  # containers only run on Linux runners and the matrix includes macOS and
  # Windows. Adding `services:` there fails the workflow rather than skipping.
  #
  # Every test in backends/learning/database-concepts SKIPS when no database is
  # reachable, which is what keeps the matrix green without one. This job is
  # what stops "skips everywhere" from counting as passing.
  # ---------------------------------------------------------------------------
  database:
    name: Database (Postgres 17 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # pgvector's image rather than the official postgres one, because the
        # vectors package needs CREATE EXTENSION vector and the official image
        # does not ship it.
        image: pgvector/pgvector:pg17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_go_db

        ports:
          - 5432:5432

        # A service container's config cannot be overridden with `command:`, so
        # max_connections stays at the default 100. That is why the test step
        # below passes -p 4: the harness gives each package its own database
        # with a pool of 10, and eleven packages at once would ask for 110.
        options: >-
          --health-cmd "pg_isready -U postgres -d learn_go_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      # One run, not two. -v so the skip messages are visible, tee so the output
      # reaches the log whether the run passes or fails.
      #
      # The grep is the point of the step. Every test in this module skips when
      # no database is reachable, which is what keeps the test matrix green
      # without one, and it means a typo in DATABASE_URL would turn this job
      # green while running nothing. A skip is not a pass.
      - name: Test against Postgres
        working-directory: backends/learning/database-concepts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -p 4 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/db-tests.log"

      - name: Fail if anything skipped for want of a database
        run: |
          if grep -q "no database available" "$RUNNER_TEMP/db-tests.log"; then
            echo "::error::tests skipped for want of a database"
            grep -n "no database available" "$RUNNER_TEMP/db-tests.log" | head
            exit 1
          fi
          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/db-tests.log") tests passed, none skipped"

  # ---------------------------------------------------------------------------
  # Backend — the module that needs Postgres, Redis and a Kafka broker.
  #
  # Separate from the `database` job because it needs three services rather than
  # one, and separate from the test matrix because service containers only run
  # on Linux runners.
  #
  # Every test in backends/learning/backend-concepts that needs a service SKIPS
  # when it cannot reach one, which is what keeps the matrix green without them.
  # This job is what stops "skips everywhere" from counting as passing.
  # ---------------------------------------------------------------------------
  backend:
    name: Services (Postgres + Redis + Kafka + Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_go_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d learn_go_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # Mailpit fits as a service container where Redpanda does not, because it is
      # configured entirely through environment variables and needs no command.
      mailpit:
        image: axllent/mailpit:latest

        env:
          MP_DATABASE: ""
          MP_SMTP_AUTH_ACCEPT_ANY: "true"
          MP_SMTP_AUTH_ALLOW_INSECURE: "true"

        ports:
          - 1025:1025
          - 8025:8025

        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      # Redpanda as a `docker run` step rather than a service container, and the
      # reason is a real limitation: a service container takes an image and
      # `options` (docker run flags) and CANNOT override the command. Redpanda
      # needs `redpanda start` with its listener flags, so it does not fit.
      #
      # The alternative is apache/kafka in KRaft mode, which is configured
      # entirely through environment variables and does fit. It is also six
      # variables that have to agree with each other, and a broker that starts
      # and advertises the wrong address looks like a client bug.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:latest \
            redpanda start \
              --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
              --node-id 0 --check=false \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://localhost:9092,external://localhost:19092

          # Poll rather than sleep. A fixed sleep is either too short on a slow
          # runner or wasted time on a fast one, and the failure mode of too
          # short is a suite that skips every Kafka test and passes.
          for i in $(seq 1 60); do
            if docker exec redpanda rpk cluster info --brokers localhost:9092 >/dev/null 2>&1; then
              echo "Redpanda ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Redpanda did not become ready"
          docker logs redpanda
          exit 1

      - name: Test the jobs module
        working-directory: backends/learning/jobs-concepts
        env:
          REDIS_ADDR: localhost:6379
        run: |
          set -o pipefail
          go test -count=1 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/jobs-tests.log"

      - name: Fail if the jobs tests skipped
        run: |
          if grep -q "no Redis at" "$RUNNER_TEMP/jobs-tests.log"; then
            grep -n "no Redis at" "$RUNNER_TEMP/jobs-tests.log" | head -3
            echo "::error::jobs tests skipped for want of a Redis"
            exit 1
          fi

      - name: Test the email module
        working-directory: backends/learning/email-concepts
        env:
          MAILPIT_SMTP_PORT: 1025
          MAILPIT_API_URL: http://localhost:8025
        run: |
          set -o pipefail
          go test -count=1 -timeout 5m -v ./... 2>&1 | tee "$RUNNER_TEMP/email-tests.log"

      - name: Fail if the email tests skipped
        run: |
          if grep -q "no Mailpit at" "$RUNNER_TEMP/email-tests.log"; then
            grep -n "no Mailpit at" "$RUNNER_TEMP/email-tests.log" | head -3
            echo "::error::email tests skipped for want of a Mailpit"
            exit 1
          fi

      - name: Test against the real services
        working-directory: backends/learning/backend-concepts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
          REDIS_ADDR: localhost:6379
          KAFKA_BROKERS: localhost:19092
        run: |
          set -o pipefail
          go test -count=1 -p 4 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"

      # A skip is not a pass. Three services means three ways for a connection
      # string to be wrong, and each one turns a third of the module green while
      # running none of it.
      - name: Fail if anything skipped for want of a service
        run: |
          missing=0

          for pattern in "no database available" "no Redis available" "no Kafka broker"; do
            if grep -q "$pattern" "$RUNNER_TEMP/backend-tests.log"; then
              echo "::error::tests skipped: $pattern"
              grep -n "$pattern" "$RUNNER_TEMP/backend-tests.log" | head -3
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/backend-tests.log") tests passed, none skipped"

      - name: Stop Redpanda
        if: always()
        run: docker rm -f redpanda

  # ---------------------------------------------------------------------------
  # Capstones — the finished services, against real Postgres and Redis.
  #
  # Its own job because a capstone is where the modules meet: if the database
  # module's isolation trick and the caching module's invalidation and the jobs
  # module's retry policy disagree with each other, this is where it shows.
  #
  # Every test that needs a service skips without one, so the step after the run
  # greps for the skip message. A skip is not a pass.
  # ---------------------------------------------------------------------------
  capstones:
    name: Capstones (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learn_go_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d learn_go_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test the url-shortener
        working-directory: capstones/url-shortener
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: |
          set -o pipefail
          go test -count=1 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/url-shortener.log"

      - name: Fail if the capstone tests skipped
        run: |
          missing=0

          for pattern in "no database available" "no Redis at"; do
            if grep -q "$pattern" "$RUNNER_TEMP/url-shortener.log"; then
              echo "::error::url-shortener tests skipped: $pattern"
              grep -n "$pattern" "$RUNNER_TEMP/url-shortener.log" | head -3
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/url-shortener.log") tests passed, none skipped"

      - name: Test the bookmark-manager
        working-directory: capstones/bookmark-manager
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/learn_go_db?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: |
          set -o pipefail
          go test -count=1 -timeout 10m -v ./... 2>&1 | tee "$RUNNER_TEMP/bookmark-manager.log"

      - name: Fail if the bookmark-manager tests skipped
        run: |
          missing=0

          for pattern in "no database available" "no Redis at"; do
            if grep -q "$pattern" "$RUNNER_TEMP/bookmark-manager.log"; then
              grep -n "$pattern" "$RUNNER_TEMP/bookmark-manager.log" | head -3
              echo "::error::bookmark-manager tests skipped: $pattern"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/bookmark-manager.log") tests passed, none skipped"

      - name: Build the images
        run: |
          for service in url-shortener bookmark-manager; do
            docker build \
              --build-arg VERSION="$GITHUB_REF_NAME" \
              --build-arg COMMIT="$GITHUB_SHA" \
              -t "$service:ci" "capstones/$service"
          done

          # The images have no shell, so `docker run ... sh -c` cannot inspect
          # them. `docker image inspect` reads the metadata instead, which is
          # where the user and the entrypoint live.
          for service in url-shortener bookmark-manager; do
            user=$(docker image inspect "$service:ci" --format '{{.Config.User}}')
            entrypoint=$(docker image inspect "$service:ci" --format '{{json .Config.Entrypoint}}')
            size=$(docker image inspect "$service:ci" --format '{{.Size}}')

            echo "$service: user=$user entrypoint=$entrypoint size=$((size / 1024 / 1024))MB"

            if [ "$user" = "" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$service runs as root"
              exit 1
            fi

            if [ "$entrypoint" = "null" ]; then
              echo "::error::$service has no exec-form ENTRYPOINT, so sh would be PID 1 and SIGTERM would not reach the binary"
              exit 1
            fi
          done


  # ---------------------------------------------------------------------------
  # AWS — the aws-concepts module against LocalStack.
  #
  # Its own job because LocalStack is a single container serving every AWS API,
  # and because these tests create and destroy real resources in it. Mixing them
  # into the services job would mean one container's failure hiding four
  # modules.
  #
  # Every test here skips without LocalStack, so the step after the run greps
  # for the skip message. A skip is not a pass.
  # ---------------------------------------------------------------------------
  aws:
    name: AWS (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      localstack:
        # LocalStack fits as a service container: it is configured entirely
        # through environment variables and needs no command override.
        image: localstack/localstack:3

        env:
          SERVICES: s3,sqs,sns,dynamodb,iam
          DEFAULT_REGION: us-east-1
          DEBUG: "0"
          PERSISTENCE: "0"
          # Without this LocalStack never checks an S3 signature, so a presigned
          # URL works after it has expired and the expiry test asserts nothing.
          S3_SKIP_SIGNATURE_VALIDATION: "0"

        ports:
          - 4566:4566

        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test against LocalStack
        working-directory: backends/learning/aws-concepts
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          set -o pipefail

          # -p 1 rather than the default. LocalStack is ONE namespace shared by
          # every package, and while the resource names are unique per test, the
          # SQS tests wait out real visibility timeouts and four packages racing
          # through one emulator makes the timings unreliable.
          go test -count=1 -p 1 -timeout 15m -v ./... 2>&1 | tee "$RUNNER_TEMP/aws-tests.log"

      - name: Fail if the AWS tests skipped
        run: |
          if grep -q "LocalStack is not reachable" "$RUNNER_TEMP/aws-tests.log"; then
            echo "::error::AWS tests skipped for want of a LocalStack"
            grep -n "LocalStack is not reachable" "$RUNNER_TEMP/aws-tests.log" | head -3
            exit 1
          fi

          echo "$(grep -c '^--- PASS' "$RUNNER_TEMP/aws-tests.log") tests passed, none skipped"


  # ---------------------------------------------------------------------------
  # Generated — regenerate the protobuf stubs and fail if they differ.
  #
  # The stubs are COMMITTED, so `git clone && go build ./...` works with nothing
  # but a Go toolchain. The reasoning is in .gitignore; this job is the other half
  # of it, because a committed generated file can drift from its source and
  # nothing else would notice.
  #
  # Its own job because it needs protoc, which nothing else does.
  # ---------------------------------------------------------------------------
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Install protoc
        # The pinned release, not apt.
        #
        # apt was the first attempt, with a comment claiming the generated code
        # does not depend on the protoc version. It does: every .pb.go header
        # records `// protoc vX.Y.Z`, so Ubuntu's 3.21.12 against a developer's
        # 36.2 is an 8-file diff that says nothing about the schema. This job
        # then fails for a reason it was not built to catch.
        #
        # .protoc-version is the single source of truth and generate.sh warns
        # when the local protoc does not match it.
        run: |
          version="$(cat backends/learning/grpc-concepts/.protoc-version)"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/protoc-${version}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          sudo cp /tmp/protoc/bin/protoc /usr/local/bin/protoc
          sudo cp -r /tmp/protoc/include/* /usr/local/include/
          protoc --version

      - name: Install the protoc plugins
        # @latest matches what generate.sh tells a developer to install. A pinned
        # version would be more reproducible and would also mean CI silently
        # passes with a plugin nobody has locally, which is the drift this job
        # exists to catch.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Regenerate the gRPC stubs
        working-directory: backends/learning/grpc-concepts
        run: ./generate.sh

      # gqlgen needs no external tool: it is a Go program, so `go run` is the
      # whole install. That is a real advantage over protoc and worth noticing
      # when choosing a generator.
      - name: Regenerate the GraphQL schema
        working-directory: backends/learning/graphql-concepts
        run: go run github.com/99designs/gqlgen generate

      - name: Fail if anything changed
        run: |
          # go.work.sum is excluded, deliberately.
          #
          # Running gqlgen and protoc-gen-go downloads modules, and `go run`
          # adds their hashes to go.work.sum for the platform it is on. A
          # developer on darwin/arm64 and a runner on linux/amd64 legitimately
          # produce different entries, so the file grows by a line on CI and the
          # job fails with a diff that says nothing about the schema.
          #
          # This job is about GENERATED CODE. A lock file that a tool touches as
          # a side effect of being run is not that, and `go work sync` keeps it
          # honest separately.
          if ! git diff --quiet -- . ':!go.work.sum'; then
            echo "::error::the generated code is out of date; run ./generate.sh and commit"
            git diff --stat -- . ':!go.work.sum'
            git diff -- . ':!go.work.sum'
            exit 1
          fi

          if ! git diff --quiet -- go.work.sum; then
            echo "::notice::go.work.sum changed, which is a side effect of running the generators and not a drift"
          fi

          echo "generated code matches the .proto files"

  # ---------------------------------------------------------------------------
  # Images — build every Dockerfile and run the containers.
  #
  # Its own job because it is slow (a cold run pulls golang and distroless) and
  # because it needs nothing else: no database, no Redis, no broker. The runner
  # already has Docker.
  # ---------------------------------------------------------------------------
  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      # BuildKit, for the cache-mount Dockerfile. It is the default since Docker
      # 23 and the runner has a newer one, so this is belt and braces and it
      # documents the requirement.
      - name: Set up Buildx
        # Pinned to a commit sha, not to @v3. This is the only third-party
        # action in the file, and a tag is mutable: whoever controls the repo
        # can repoint v3 at anything and every workflow using it picks that up
        # on the next run. A sha cannot be repointed.
        #
        # The cost is that nothing bumps it for you, so the tag it corresponds
        # to goes in the comment. This one is v3.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and run every image
        working-directory: backends/learning/docker-concepts
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -v ./... 2>&1 | tee "$RUNNER_TEMP/image-tests.log"

      - name: Fail if the image tests skipped
        run: |
          if grep -q "Docker is not available" "$RUNNER_TEMP/image-tests.log"; then
            grep -n "Docker is not available" "$RUNNER_TEMP/image-tests.log" | head -3
            echo "::error::image tests skipped for want of a Docker daemon"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Race — the race detector on its own job, because it is 5-10x slower than a
  # normal run and does not need the full matrix to be useful. One platform,
  # current Go.
  #
  # This is the job that justifies the whole workflow. A data race is undefined
  # behaviour that usually does not reproduce locally, and `-race` is the only
  # thing that reliably finds one. See go-concepts/16-race-detector.
  # ---------------------------------------------------------------------------
  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test with -race
        run: go test -race -count=1 $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Cross-compile — build for every target the repo claims to support.
  #
  # This job exists because of a real bug: lesson 14 had platform files for
  # `unix` and `windows`, which looks exhaustive and is not. js/wasm, wasip1
  # and plan9 are none of those, and the package failed to build for them with
  # "undefined: currentPlatform".
  #
  # Nothing else catches that. Not the compiler, not vet, not the linter, and
  # not a test matrix of Linux, macOS and Windows, which is exactly what the
  # jobs above are. Only building for the uncovered target does.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier one: the targets something could actually be deployed to.
          # Every module has to build for all of these.
          - goos: linux
            goarch: amd64
            scope: all
          - goos: linux
            goarch: arm64
            scope: all
          - goos: darwin
            goarch: arm64
            scope: all
          - goos: windows
            goarch: amd64
            scope: all

          # Tier two: the targets that exist to prove the toolchain is doing
          # real work, and that a dependency-free package is genuinely portable.
          #
          # These build the pure-Go modules ONLY, because the backend modules
          # cannot build for them and never could. asynq calls
          # Server.waitForSignals, which lives in a Unix-signal file with no
          # plan9 build. kafka-go names syscall.ECONNREFUSED, which plan9's
          # syscall package does not define. Neither is a bug in this repo and
          # neither will be fixed, because nobody runs a Kafka consumer on
          # plan9.
          #
          # Listing them as "all" is what the first version of this job did, and
          # it failed on every commit for a reason that had nothing to do with
          # the change being tested. A check that can never pass is noise.
          - goos: js
            goarch: wasm
            scope: portable
          - goos: wasip1
            goarch: wasm
            scope: portable
          - goos: plan9
            goarch: amd64
            scope: portable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      # Build only; these targets cannot all be RUN here, and a build failure
      # is what this job is looking for.
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.scope }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          SCOPE: ${{ matrix.scope }}
        run: |
          if [ "$SCOPE" = "all" ]; then
            targets=$(go list -m -f '{{.Dir}}/...')
          else
            targets="./go-concepts/... ./dsa/..."
          fi

          echo "building: $targets"
          go build $targets

  # ---------------------------------------------------------------------------
  # Coverage — informational. It writes a profile and prints the total, without
  # a threshold that fails the build.
  #
  # A coverage gate mostly teaches people to write tests that execute lines
  # without asserting anything. The number is worth watching and not worth
  # enforcing.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: |
            **/go.sum
            go.work.sum

      - name: Test with coverage
        run: go test -coverprofile=coverage.out $(go list -m -f '{{.Dir}}/...')

      - name: Report total
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload the profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
