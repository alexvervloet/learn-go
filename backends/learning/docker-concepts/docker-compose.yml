# The service, with the compose features a Go service actually uses.
#
#   docker compose up --build
#   curl localhost:8081/buildinfo
#
# Everything here is a decision the file explains, because a compose file is the most copied and least read file
# in a repository.

services:
  api:
    build:
      context: .

      # Which Dockerfile, named explicitly. The default is ./Dockerfile and this directory has seven,
      # so a default would build nothing.
      dockerfile: dockerfiles/03-distroless.Dockerfile

      # Build arguments, so the image knows what it is. These come from the shell's environment with
      # a fallback, which is the shape a CI pipeline fills in and a developer ignores.
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-unknown}

    ports:
      # 8081, off the default, so this can run alongside anything else serving 8080.
      - "8081:8080"

    environment:
      PORT: 8080

      # GOMEMLIMIT, set to slightly below the container's memory limit.
      #
      # The Go runtime does NOT read the cgroup limit. Without this it targets the host's memory, so a
      # service in a 128M container happily grows past it and the OOM killer arrives before the GC
      # does. The symptom is a container restarting with exit code 137 and no Go error anywhere.
      #
      # 100MiB against a 128M limit leaves headroom for the runtime's own overhead, which is not
      # counted by GOMEMLIMIT: it is a target for the HEAP, not a hard cap on the process.
      GOMEMLIMIT: 100MiB

      # GOMAXPROCS is the other one. The runtime reads the number of HOST cpus, not the container's cpu
      # limit, so a service limited to 0.5 cpu on a 64-core node starts 64 OS threads and spends its
      # time on scheduler contention.
      #
      # Go 1.25 made the runtime cgroup-aware for this, so it is no longer needed on a current
      # toolchain. It is here because it is still in every guide and because a service on an older Go
      # needs it.
      # GOMAXPROCS: 1

    # The healthcheck cannot use curl or wget: a distroless image has neither.
    #
    # So it runs the SERVER'S OWN BINARY with a flag, which is the pattern for a distroless healthcheck
    # and is why many services grow a `-healthcheck` mode. This one does not have one, so the check is
    # disabled and the comment says why rather than pretending.
    #
    # The alternatives: a healthcheck defined at the orchestrator level (Kubernetes does an HTTP GET
    # itself and needs nothing in the image), or the distroless :debug tag, which puts busybox back.
    healthcheck:
      disable: true

    # stop_grace_period is how long compose waits after SIGTERM before SIGKILL. The default is 10s.
    #
    # It has to be LONGER than the server's own shutdown timeout, which is 10s in main.go, or the
    # runtime kills a server that was shutting down correctly. Ten and ten is exactly the wrong pair:
    # they race.
    stop_grace_period: 20s

    # init: true puts a minimal init process at PID 1 to reap zombies.
    #
    # A Go server that never forks has no zombies to reap, so this is unnecessary here and is included
    # with the explanation because it is cargo-culted into every compose file. It IS necessary for a
    # process that shells out, which is most Python and Node services.
    init: false

    # Read-only root filesystem, because a Go binary writes nothing outside /tmp.
    #
    # This is close to free and it stops an attacker with RCE from dropping a file anywhere. The tmpfs
    # gives back the one directory anything might need.
    read_only: true

    tmpfs:
      - /tmp:size=64m

    # Drop every capability. A process listening on 8080 needs none: NET_BIND_SERVICE is only required
    # below 1024, which is why a container should never listen on 80.
    cap_drop:
      - ALL

    security_opt:
      # no-new-privileges stops a setuid binary inside the container from escalating. A distroless
      # image has no setuid binaries, so this is defence in depth and one line.
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          # A memory limit, because without one a leak takes down the HOST rather than the container.
          # 128M is generous for this service and small enough that a runaway allocation is killed.
          #
          # Go 1.19+ reads cgroup limits through GOMEMLIMIT only if you SET it; the runtime does not
          # detect the container limit by itself. Without it, the GC targets the host's memory and the
          # OOM killer gets there first.
          memory: 128M
