name: CI

# Runs on every push to main and every pull request. Unlike the Python repo's
# workflow, this one is not path-scoped: Go builds the whole workspace in
# seconds, so filtering would add configuration without saving time.
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch when a new push arrives.
# Without this, a rapid series of pushes queues up redundant runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token needs nothing beyond reading the repo. Setting this
# explicitly means a compromised action cannot push, comment, or open a PR.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting, vet, and golangci-lint. Kept as its own job so a
  # formatting mistake surfaces without waiting for the test matrix.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          # setup-go keys its cache on every go.sum in the repo, which is the
          # right key for a workspace: adding a dependency anywhere
          # invalidates it. Until a module has dependencies there is no go.sum
          # and the step logs "Dependencies file is not found". That warning is
          # expected here and resolves itself once the backend modules land.
          cache: true

      # gofmt is not a style preference in Go, it is the format. There is one
      # correct output per file, so this is a hard failure rather than advice.
      # Every step below runs the same Makefile target you would run locally,
      # so a green `make check` on your machine means something. Spelling the
      # commands out twice is how CI and local drift apart.
      #
      # gofmt is not a style preference in Go, it is the format: one correct
      # output per file. So this is a hard failure rather than advice.
      - name: Check formatting
        run: make fmt-check

      # go vet ships with the toolchain and catches a specific set of real
      # bugs: printf verbs that do not match their arguments, unreachable code,
      # struct tags that will not parse, locks copied by value.
      - name: Vet
        run: make vet

      # golangci-lint is installed with `go install` rather than through
      # golangci/golangci-lint-action. Two reasons, both learned the hard way
      # on this workflow's first run:
      #
      #  1. The action's `version: latest` resolves to the v1 line, which
      #     cannot read a v2-format .golangci.yml and fails with
      #     "can't load config".
      #  2. Its prebuilt binary is compiled with an older Go than this module
      #     targets, which it refuses outright: "the Go language version
      #     (go1.24) used to build golangci-lint is lower than the targeted Go
      #     version". Building from source uses the toolchain set up above, so
      #     the two can never disagree.
      #
      # A third trap, unrelated to the action: `$(...)` inside an action's
      # `with: args:` is NOT expanded by a shell. It arrives literally.
      - name: Install golangci-lint
        run: make tools

      - name: Lint
        run: make lint

      # go.mod and go.sum must be what the code actually needs. Go 1.23's
      # -diff reports what tidy WOULD change and exits non-zero if anything,
      # with no copy-run-compare dance.
      #
      # Lesson 15 recommends this; the repo should follow its own advice.
      - name: Check go.mod is tidy
        run: make tidy-check

      # go.work is local only, and a consumer never sees it. A module that
      # imports another without the matching require builds fine here and
      # fails for everyone else. GOWORK=off is how you find out.
      - name: Check each module builds without the workspace
        run: make isolated-check

  # ---------------------------------------------------------------------------
  # Test — matrix across the two supported Go versions and both major OSes.
  #
  # fail-fast: false so a failure on one combination does not hide the others.
  # Windows is in the matrix because path handling and file permissions are
  # where cross-platform Go actually breaks, and this repo touches both.
  # ---------------------------------------------------------------------------
  test:
    name: Test / Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Windows on the older Go adds runner minutes without adding coverage:
        # anything it would catch, one of the other five combinations catches.
        exclude:
          - os: windows-latest
            go: "1.26"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build $(go list -m -f '{{.Dir}}/...')

      # -count=1 disables the test cache. In CI the cache is cold anyway, so
      # this costs nothing and removes any doubt about what actually ran.
      - name: Test
        run: go test -count=1 $(go list -m -f '{{.Dir}}/...')

      # Code behind a build tag is NOT compiled by default, so it is not type
      # checked, not vetted and not covered. Without this step,
      # go-concepts/14-embed-and-build-tags/debug_on.go could be broken for
      # months and every job would stay green.
      #
      # Every custom tag the repo uses belongs here.
      - name: Test with build tags
        run: go test -count=1 -tags debug $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Race — the race detector on its own job, because it is 5-10x slower than a
  # normal run and does not need the full matrix to be useful. One platform,
  # current Go.
  #
  # This is the job that justifies the whole workflow. A data race is undefined
  # behaviour that usually does not reproduce locally, and `-race` is the only
  # thing that reliably finds one. See go-concepts/16-race-detector.
  # ---------------------------------------------------------------------------
  race:
    name: Race detector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Test with -race
        run: go test -race -count=1 $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Cross-compile — build for every target the repo claims to support.
  #
  # This job exists because of a real bug: lesson 14 had platform files for
  # `unix` and `windows`, which looks exhaustive and is not. js/wasm, wasip1
  # and plan9 are none of those, and the package failed to build for them with
  # "undefined: currentPlatform".
  #
  # Nothing else catches that. Not the compiler, not vet, not the linter, and
  # not a test matrix of Linux, macOS and Windows, which is exactly what the
  # jobs above are. Only building for the uncovered target does.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: js
            goarch: wasm
          - goos: wasip1
            goarch: wasm
          - goos: plan9
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Build only; these targets cannot all be RUN here, and a build failure
      # is what this job is looking for.
      - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build $(go list -m -f '{{.Dir}}/...')

  # ---------------------------------------------------------------------------
  # Coverage — informational. It writes a profile and prints the total, without
  # a threshold that fails the build.
  #
  # A coverage gate mostly teaches people to write tests that execute lines
  # without asserting anything. The number is worth watching and not worth
  # enforcing.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out $(go list -m -f '{{.Dir}}/...')

      - name: Report total
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload the profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
